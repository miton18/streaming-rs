[workspace]
resolver = "3"
members = [
    "crates/streaming-core",
    "crates/streaming-runtime",
    "crates/streaming-sim",
    "crates/streaming-gossip",
    "crates/streaming-kv-redis",
    "crates/streaming-warp10",
    "crates/streaming-pulsar",
    "crates/streaming-openapi",
    "crates/streaming-openapi-macros",
    "crates/streaming-api",
    "crates/streamd",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/miton18/streaming-rs"

[workspace.dependencies]
streaming-core = { path = "crates/streaming-core" }
streaming-runtime = { path = "crates/streaming-runtime" }
streaming-gossip = { path = "crates/streaming-gossip" }
streaming-kv-redis = { path = "crates/streaming-kv-redis" }
streaming-warp10 = { path = "crates/streaming-warp10" }
streaming-api = { path = "crates/streaming-api" }
streaming-pulsar = { path = "crates/streaming-pulsar" }
streaming-openapi = { path = "crates/streaming-openapi" }
streaming-openapi-macros = { path = "crates/streaming-openapi-macros" }

moonpool-core = "0.8.0"
moonpool-sim = "0.8.0"

async-trait = "0.1"
bytes = "1"
futures = "0.3"
parking_lot = "0.12"
schemars = { version = "1.2", default-features = false, features = ["derive", "std"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
tracing = "0.1"

[profile.dev]
debug = "line-tables-only"

[profile.release]
debug = "line-tables-only"

# For `cargo mutants --profile mutants`: the simulations run about ten times
# faster than in the dev profile, and incremental builds stay short. Debug
# assertions and overflow checks stay on: some mutants are only caught by them.
[profile.mutants]
inherits = "release"
opt-level = 1
debug = false
debug-assertions = true
overflow-checks = true
incremental = true
codegen-units = 256
