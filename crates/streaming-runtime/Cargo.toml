[package]
name = "streaming-runtime"
description = "The streaming-rs execution engine: actors, backpressure, exactly-once commits, workers and placement."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = ["gossip"]
# Membership through the Scuttlebutt gossip of `streaming-gossip`.
gossip = ["dep:streaming-gossip"]
# Bugs planted on purpose, for the simulation to notice. Never in production.
mutants = []

[dependencies]
streaming-core.workspace = true
streaming-gossip = { workspace = true, optional = true }
async-trait.workspace = true
futures.workspace = true
moonpool-core.workspace = true
parking_lot.workspace = true
postcard.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
