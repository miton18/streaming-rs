[package]
name = "streaming-warp10"
description = "Warp 10 sink connector (HTTP ingress, /api/v0/update) written against the Moonpool provider traits, with a fake ingress for tests and simulations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = []
# TLS (https endpoints) through rustls over the futures-io stream, ring crypto, webpki-roots trust anchors.
tls = ["dep:futures-rustls", "dep:webpki-roots"]

[dependencies]
streaming-core.workspace = true
moonpool-core.workspace = true
async-trait.workspace = true
futures.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tokio-util.workspace = true
tracing.workspace = true
futures-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }

[dev-dependencies]
moonpool-sim.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
tokio-util = { workspace = true, features = ["compat"] }
